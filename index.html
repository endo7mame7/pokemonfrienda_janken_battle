<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html{box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ピックじゃんけんバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  --ground:#23305e; --ground2:#2e3d75; --panel:#fff; --ink:#1d2340;
  --p1:#ff5d52; --p2:#23b8e8; --sun:#ffd23f; --mint:#3ddc97; --muted:#9aa6d6;
  /* メガシンカはレインボー。演出はすべてこの2つを使う */
  --rb:linear-gradient(90deg,#ff3b30,#ff9500,#ffd23f,#3ddc97,#23b8e8,#5b6bff,#c56bff,#ff3b30);
  --rbc:conic-gradient(from 0deg,#ff3b30,#ff9500,#ffd23f,#3ddc97,#23b8e8,#5b6bff,#c56bff,#ff3b30);
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
html,body{height:100%}
body{background:var(--ground);color:#fff;font-family:var(--body);font-weight:500;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:radial-gradient(circle at 20% 10%,#34448a 0,transparent 40%),radial-gradient(circle at 90% 90%,#3a2a6e 0,transparent 45%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.screen{height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box;overflow-y:auto}
.screen[hidden]{display:none!important}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.bar{display:flex;align-items:center;gap:12px;padding-block:14px}
.bar h2{font-size:20px;flex:1}
.back{width:44px;height:44px;border-radius:50%;background:var(--ground2);font-size:22px}
.btn{font-family:var(--display);font-size:20px;padding:14px 22px;border-radius:18px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #c99a00;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a00}
.btn.sub{background:#fff;box-shadow:0 5px 0 #b9c0e0}
.btn[disabled]{opacity:.4;pointer-events:none}
.small{font-size:15px;padding:10px 14px;border-radius:14px}

/* home */
#home{justify-content:center;gap:22px;padding-block:20px}
.logo{text-align:center}
.logo h1{font-size:clamp(30px,9vw,44px);line-height:1.15;letter-spacing:.02em}
.logo h1 span{display:block;color:var(--sun);-webkit-text-stroke:0}
.logo p{margin:6px 0 0;color:var(--muted);font-size:13px}
.sizesel{display:flex;flex-direction:column;align-items:center;gap:8px}
.sizesel .lb{font-family:var(--display);font-size:15px;color:var(--sun)}
.sizebtn{padding:9px 16px;border-radius:99px;font-family:var(--display);font-size:15px;background:var(--ground2);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.sizebtn.on{background:var(--sun);color:var(--ink)}
.sizebtn[disabled]{opacity:.35;box-shadow:none}
.sizehint{margin:0;color:var(--muted);font-size:12px;text-align:center}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.sidelb{font-family:var(--display);font-size:16px;text-align:center}
.side.s1 .sidelb{color:var(--p1)} .side.s2 .sidelb{color:var(--p2)}
.slot{position:relative;border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:170px;justify-content:center;width:100%;box-sizing:border-box}
.slot.p1{background:var(--p1)} .slot.p2{background:var(--p2)}
.slot img{max-height:96px;max-width:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.slot .empty{width:90px;height:90px;border:3px dashed rgba(255,255,255,.7);border-radius:16px;display:grid;place-items:center;font-size:34px}
.slot .meta{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.slot .nm{font-weight:800;font-size:14px;text-align:center;line-height:1.2}
.slot .ord{display:none}
/* チーム戦：スロットを縦に積むので、1枠を低くして 出場順バッジは角に逃がす */
.vs.team .slot{position:relative;min-height:0;gap:5px;padding:8px 6px}
.vs.team .slot .ord{display:grid;place-items:center;position:absolute;left:5px;top:5px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.3);font-family:var(--display);font-size:11px}
.vs.team .slot img{height:52px;width:auto}
.vs.team .slot .empty{width:46px;height:46px;border-width:2px;border-radius:10px;font-size:20px}
.vs.team .slot .meta{gap:4px;width:100%}
.vs.team .slot .nm{font-size:11px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs.team .slot .chip{font-size:10px;padding:2px 7px;white-space:nowrap}
.vs.n3 .slot{gap:3px;padding:6px 5px}
.vs.n3 .slot img{height:42px}
.vs.n3 .slot .empty{width:38px;height:38px}
.vs.n3 .slot .chip{display:none}   /* 3対3は枠が低いので タイプ表示は省く */
.vsmark{font-family:var(--display);font-size:26px;color:var(--sun)}
.homeacts{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.ver{margin:-6px 0 0;text-align:center;font-size:11px;color:var(--muted);opacity:.75;
  font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* dex / select */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding-bottom:24px}
.card{position:relative;background:var(--ground2);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.card img{height:90px;object-fit:contain;max-width:100%}
.card .nm{font-weight:800;font-size:14px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff}
.card .del{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);font-size:14px}
.card.edit:active{transform:scale(.97)}
.card .editic{position:absolute;left:7px;top:7px;font-size:12px;opacity:.8;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.card.used{opacity:.55}
.card .usedlb{font-size:10px;font-weight:800;color:var(--sun);line-height:1.2}
.card.sel{outline:4px solid var(--sun)}
.addcard{border:3px dashed var(--muted);background:transparent;min-height:150px;justify-content:center;font-weight:800;color:var(--muted)}
.addcard b{font-size:38px;line-height:1}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}

/* editor */
#editor{gap:12px;padding-bottom:20px}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#0e1430;flex-shrink:0}
#edCanvas{display:block;width:100%;touch-action:none}
.stage .tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{background:var(--ground2);border-radius:12px;padding:9px 12px;font-weight:800;font-size:14px}
.tool.on{background:var(--sun);color:var(--ink)}
.slider{display:flex;align-items:center;gap:10px;font-size:14px}
.slider input{flex:1;accent-color:var(--sun)}
.slider output{width:52px;text-align:right;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px}
.field input[type=text]{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:0;color:var(--ink)}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{padding:6px 10px;border-radius:99px;font-weight:800;font-size:13px;opacity:.45;color:#fff}
.types button.on{opacity:1;box-shadow:0 0 0 3px #fff}
.megas{display:flex;flex-direction:column;gap:6px}
.megas button{padding:8px 11px;border-radius:12px;font-weight:800;font-size:13px;color:#fff;
  background:var(--ground2);opacity:.45;text-align:left;line-height:1.25}
.megas button.on{opacity:1;box-shadow:0 0 0 3px #fff}
.megas button small{display:block;font-size:11px;font-weight:500;margin-top:2px}
.megadesc{font-size:10px;color:var(--muted);line-height:1.25;text-align:center}
.megabadge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;color:#fff;line-height:1.3;
  background:var(--rb);background-size:300% 100%;animation:rbflow 3.4s linear infinite;
  text-shadow:0 1px 2px rgba(0,0,0,.55)}
@keyframes rbflow{to{background-position:300% 0}}
@keyframes rbspin{to{transform:rotate(360deg)}}
.slot .megaic,.card .megaic{position:absolute;right:6px;top:6px;font-size:13px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.pickwrap{display:flex;gap:10px;flex-wrap:wrap}
.pickwrap .btn{flex:1;min-width:140px;text-align:center}
.filein{display:none}

/* battle */
#battle{position:relative;padding:0;display:grid;grid-template-rows:23% 1fr 23%;overflow:hidden}
.zone{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:8px 12px;position:relative}
.zone.p1{background:linear-gradient(0deg,#d8423a,var(--p1))}
.zone.p2{background:linear-gradient(0deg,#1497c4,var(--p2));transform:rotate(180deg)}
.zone .msg{font-family:var(--display);font-size:17px;min-height:1.3em;text-align:center}
.hands{display:flex;gap:14px;justify-content:center}
.hand{position:relative;width:min(24vw,96px);aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;font-size:min(12vw,48px);display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:none}
.hand svg{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg);pointer-events:none}
.hand circle{fill:none;stroke:var(--sun);stroke-width:8;stroke-dasharray:301;stroke-dashoffset:301}
.hand.holding circle{transition:stroke-dashoffset .5s linear;stroke-dashoffset:0}
.locked{font-family:var(--display);font-size:30px;color:var(--sun);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.bond{position:relative;width:min(88%,330px);height:15px;border-radius:99px;background:rgba(0,0,0,.32);
  overflow:hidden;flex-shrink:0}
/* メガシンカできるとき ピック自体が虹に脈打つ。長押しすると 光って確認が出る */
.fighter{touch-action:none}
.fighter.canmega img{animation:megaready 1.3s ease-in-out infinite}
@keyframes megaready{
  0%,100%{filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  50%{filter:drop-shadow(0 0 13px #c56bff) drop-shadow(0 0 24px #ffd23f) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
}
.fighter.holding img{animation:none;transition:filter .3s,transform .3s;transform:scale(.94);
  filter:brightness(1.5) drop-shadow(0 0 18px #fff) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
/* メガシンカするか聞く。その子から読める向きで出す */
.megaask{position:absolute;inset:0;z-index:16;display:grid;place-items:center;background:rgba(6,8,26,.84)}
.megaask .box{background:var(--ground2);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;
  align-items:center;gap:11px;width:min(80%,300px);box-shadow:0 0 0 4px rgba(255,255,255,.18);
  --L:min(42vw,17vh,170px)}
.megaask.flip .box{transform:rotate(180deg)}
.megaask .ttl{font-family:var(--display);font-size:clamp(18px,5.6vw,23px);background:var(--rb);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rbflow 1.4s linear infinite}
.megaask img{object-fit:contain;filter:drop-shadow(0 0 12px #c56bff)}
.megaask .nm{font-weight:800;font-size:13px;text-align:center}
/* きずなが満タンになった1回だけ、手えらびの案内を さしかえて操作を伝える */
.zone .msg.hintmsg{font-size:14px;color:var(--sun)}
.bond i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#f0582a,#ffb03f,#ffd23f);transition:width .45s ease}
.bond b{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.7);letter-spacing:.02em}
.bond.full i,.bond.mega i{background:var(--rb);background-size:300% 100%;animation:rbflow 1.3s linear infinite}
.bond.mega i{animation-duration:.9s}
/* メガシンカボタン：長押しのあいだ 白いワイプが満ちる */
/* メガシンカ中のオーラ。写真の色を変えないよう hue-rotate は使わず 影の色を順に変える */
.fighter.mega img{animation:megaaura 1.6s linear infinite}
@keyframes megaaura{
  0%  {filter:drop-shadow(0 0 9px #ff3b30) drop-shadow(0 0 22px #ff9500) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  17% {filter:drop-shadow(0 0 9px #ff9500) drop-shadow(0 0 22px #ffd23f) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  34% {filter:drop-shadow(0 0 9px #ffd23f) drop-shadow(0 0 22px #3ddc97) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  50% {filter:drop-shadow(0 0 9px #3ddc97) drop-shadow(0 0 22px #23b8e8) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  67% {filter:drop-shadow(0 0 9px #23b8e8) drop-shadow(0 0 22px #5b6bff) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  84% {filter:drop-shadow(0 0 9px #5b6bff) drop-shadow(0 0 22px #c56bff) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  100%{filter:drop-shadow(0 0 9px #c56bff) drop-shadow(0 0 22px #ff3b30) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
}
/* 背後でゆっくり回る虹の輪 */
.fighter.mega::before{content:'';position:absolute;inset:-16%;border-radius:50%;z-index:-1;
  background:var(--rbc);filter:blur(16px);opacity:.5;animation:rbspin 3.5s linear infinite}
@media (prefers-reduced-motion:reduce){
  .bond.full i,.bond.mega i,.fighter.canmega img,.megaask .ttl,.megabadge,.fighter.mega img,.fighter.mega::before,
  .megacut .rbrays,.megacut .rings i,.megacut .stone,.megacut .ct b,.cutin.mega .ct b,
  .megaintro .stone,.megaintro .band,.megaintro .ct b,.megaintro .shock{animation:none}
  .fighter.mega img{filter:drop-shadow(0 0 12px #c56bff) drop-shadow(0 0 22px #ffd23f) drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  .megacut .sparks{display:none}
}
.arena{position:relative;display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center;padding:6px 12px}
.fighter{position:relative;display:flex;align-items:center;gap:10px;will-change:transform;z-index:2}
.fighter .spin{display:grid;grid-template-columns:56px auto 56px;align-items:center;justify-items:center;gap:10px}
.f2 .spin{transform:rotate(180deg)}
.fighter{--L:min(46vw,21vh,190px)}
.cutin{--L:min(80vw,36vh,340px)}
.result{--L:min(62vw,22vh,240px)}
.fighter img,.cutin img{object-fit:contain}
.ori-h{width:var(--L);height:calc(var(--L) / 1.62)}
.ori-v{height:var(--L);width:calc(var(--L) / 1.62)}
.fighter img{filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.hearts{display:flex;flex-direction:column;gap:2px;font-size:22px;line-height:1}
.hearts .gone{opacity:.2;filter:grayscale(1)}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px}
.roster{display:flex;gap:4px}
.roster i{width:10px;height:15px;border-radius:3px;border-bottom-left-radius:7px;background:#fff;opacity:.25}
.roster i.alive{opacity:1}
.roster i.cur{box-shadow:0 0 0 2px var(--sun)}
.throw{font-size:44px;width:56px;text-align:center;opacity:0}
.banner{font-family:var(--display);font-size:clamp(26px,8vw,40px);color:var(--sun);text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.35);min-height:1.2em;display:flex;flex-direction:column;align-items:center;gap:2px}
.banner .flip{transform:rotate(180deg);font-size:.55em;color:#fff}
.banner .mv{font-size:.6em;color:#fff}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.quit{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.3);z-index:6;font-size:18px}
.result{position:absolute;inset:0;z-index:14;overflow:hidden;background:radial-gradient(120% 70% at 50% 50%,#2a3470,#141a38 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
/* 勝ったチームの色で 背景に放射光をゆっくり回す（--wc は finish() が入れる） */
.result .rays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;
  background:repeating-conic-gradient(from 0deg,rgba(var(--wc),.14) 0deg 5deg,rgba(var(--wc),0) 5deg 11deg);
  animation:rayspin 26s linear infinite}
@keyframes rayspin{to{transform:rotate(360deg)}}
/* 放射光の上に うすい暗幕。中央ほど濃くして 文字のコントラストを確保する */
.result .dim{position:absolute;inset:0;background:radial-gradient(72% 48% at 50% 50%,rgba(10,14,40,.74),rgba(10,14,40,.18))}
/* 紙吹雪。1つずつ 位置・色・速さ・開始位置を変える */
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12%;width:8px;height:13px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(118vh) rotate(760deg)}}
.result .stack{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;
  max-height:100%;padding:8px 12px;box-sizing:border-box;overflow:hidden auto}
.result .w{font-family:var(--display);font-size:clamp(28px,9.5vw,44px);color:var(--sun);text-align:center;
  text-shadow:0 4px 0 rgba(0,0,0,.35)}
.result .w.lose{font-size:clamp(19px,6vw,28px);color:#c9d2f0;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.result .w.flip{transform:rotate(180deg)}
.result .sweep{font-family:var(--display);font-size:clamp(12px,3.4vw,16px);color:#fff;text-align:center;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.result .sweep.flip{transform:rotate(180deg)}
.result .crown{font-size:clamp(26px,8vw,36px);line-height:1}
/* 勝者ピックの後ろに ふわっとした光 */
.result .champ{position:relative;display:grid;place-items:center;padding:6px}
.result .champ::before{content:'';position:absolute;width:150%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,63,.5),rgba(255,210,63,0) 68%)}
.result img{position:relative;object-fit:contain;animation:bob 1.2s ease-in-out infinite;
  filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.result .hp{display:flex;gap:3px;font-size:19px;line-height:1}
.result .hp .gone{opacity:.2;filter:grayscale(1)}
/* チーム戦績：たおれたピックは 白黒にする */
.teamline{display:flex;align-items:center;gap:5px;justify-content:center;flex-wrap:wrap;
  background:rgba(10,14,40,.5);padding:4px 9px;border-radius:99px}
.teamline.flip{transform:rotate(180deg)}
.teamline b{font-family:var(--display);font-size:11px;padding:3px 9px;border-radius:99px}
.teamline.t1 b{background:var(--p1)} .teamline.t2 b{background:var(--p2)}
.teamline i{position:relative;display:block;width:30px;height:20px;background-size:contain;background-repeat:no-repeat;
  background-position:center;border-radius:2px}
.teamline i.down{filter:grayscale(1) brightness(.55)}
.teamline i.down::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;
  font-size:14px;font-weight:800;color:#ff5d52;text-shadow:0 1px 2px #000}
/* 上から順に ぽんぽん出す */
.result .pop{animation:pop .42s cubic-bezier(.2,.9,.3,1.35) backwards}
@keyframes pop{from{opacity:0;transform:scale(.55)}}
.result .flip.pop{animation-name:popflip}
@keyframes popflip{from{opacity:0;transform:rotate(180deg) scale(.55)}to{transform:rotate(180deg) scale(1)}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:20;padding-inline:16px}
.modal .box{background:#fff;color:var(--ink);border-radius:18px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--ink);padding:10px 18px;border-radius:99px;font-weight:800;z-index:30}

/* メガシンカ前のカットイン。メガストーンが光って 絆が高まるところを見せる */
.megaintro{position:absolute;inset:0;z-index:13;pointer-events:none;overflow:hidden;display:grid;place-items:center;
  background:#070a1c}
.megaintro .band{position:absolute;left:-20%;right:-20%;top:26%;height:48%;transform:rotate(-12deg);
  background:var(--rb);background-size:200% 100%;animation:rbflow 1s linear infinite;opacity:.9;
  box-shadow:0 0 0 7px #fff,0 0 0 13px var(--ink)}
.megaintro .veil{position:absolute;inset:0;background:radial-gradient(58% 44% at 50% 50%,rgba(7,10,28,.22),rgba(7,10,28,.74))}
.megaintro .stone{position:relative;z-index:2;width:min(40vw,170px);aspect-ratio:1;border-radius:50%;
  background:var(--rbc);animation:rbspin 1.1s linear infinite;
  box-shadow:0 0 26px #fff,0 0 60px #c56bff,0 0 90px rgba(255,210,63,.6)}
.megaintro .stone i{position:absolute;inset:11%;border-radius:50%;
  background:radial-gradient(circle at 33% 26%,rgba(255,255,255,.95),rgba(255,255,255,.12) 44%,rgba(0,0,0,.4))}
.megaintro .shock{position:absolute;z-index:1;width:22vmin;aspect-ratio:1;border-radius:50%;border:6px solid #fff;
  opacity:0;animation:shockout .75s ease-out .3s forwards}
@keyframes shockout{0%{transform:scale(.25);opacity:.95}100%{transform:scale(6);opacity:0}}
.megaintro .ct{position:absolute;z-index:3;left:0;right:0;text-align:center;font-family:var(--display);color:#fff;
  line-height:1.15;font-size:clamp(20px,6.4vw,32px);
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.megaintro .ct b{display:block;font-weight:400;font-size:clamp(24px,8vw,40px);background:var(--rb);

  filter:drop-shadow(0 3px 0 rgba(0,0,0,.7));animation:rbflow 1.1s linear infinite}
.megaintro .ct.bot{bottom:9%} .megaintro .ct.top{top:9%;transform:rotate(180deg)}

/* メガシンカ発動の専用演出。すべてレインボー */
.megacut{position:absolute;inset:0;z-index:13;pointer-events:none;overflow:hidden;display:grid;place-items:center;
  background:#0a0c1e;--L:min(70vw,30vh,290px)}
/* 放射光の上に重ねる。中央は虹を見せ、文字が乗る端だけ暗く落とす */
.megacut .dim{position:absolute;inset:0;background:radial-gradient(66% 48% at 50% 50%,rgba(6,8,26,.1),rgba(6,8,26,.84))}
.megacut .rbrays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;
  background:repeating-conic-gradient(from 0deg,#ff3b30 0deg 6deg,#ff9500 6deg 12deg,#ffd23f 12deg 18deg,
    #3ddc97 18deg 24deg,#23b8e8 24deg 30deg,#5b6bff 30deg 36deg,#c56bff 36deg 42deg);
  opacity:.7;animation:rbspin 7s linear infinite}
.megacut .rings{position:absolute;inset:0;display:grid;place-items:center}
.megacut .rings i{position:absolute;width:24vmin;aspect-ratio:1;border-radius:50%;border:5px solid #fff;
  box-shadow:0 0 0 5px #ff3b30,0 0 0 11px #ffd23f,0 0 0 17px #3ddc97,0 0 0 23px #23b8e8,0 0 0 29px #c56bff;
  animation:ringout 1.15s ease-out forwards}
@keyframes ringout{from{transform:scale(.08);opacity:.95}to{transform:scale(3.2);opacity:0}}
.megacut .flash{position:absolute;inset:0;background:#fff}
.megacut img{position:relative;z-index:1;filter:drop-shadow(0 0 26px #fff) drop-shadow(0 10px 0 rgba(0,0,0,.4))}
.megacut .sparks{position:absolute;inset:0}
.megacut .sparks i{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;
  border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:spark 1.05s ease-out forwards}
@keyframes spark{
  0%{transform:rotate(var(--a)) translateY(0) scale(0);opacity:1}
  25%{opacity:1}
  100%{transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(.35);opacity:0}
}
.megacut .stone{position:absolute;z-index:2;font-size:clamp(54px,20vw,110px);
  filter:drop-shadow(0 0 18px #fff) drop-shadow(0 0 34px #c56bff)}
.megacut .ct{position:absolute;left:0;right:0;z-index:3;text-align:center;font-family:var(--display);color:#fff;
  line-height:1.1;font-size:clamp(24px,8vw,40px);
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.megacut .ct b{display:block;font-weight:400;font-size:clamp(26px,9vw,44px);background:var(--rb);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.7));animation:rbflow 1.1s linear infinite}
.megacut .ct.bot{bottom:8%} .megacut .ct.top{top:8%;transform:rotate(180deg)}

/* カットイン */
.cutin{position:absolute;inset:0;z-index:12;pointer-events:none;overflow:hidden;display:grid;place-items:center}
.cutin .dim{position:absolute;inset:0;background:rgba(10,14,40,.92)}
.cutin .flash{position:absolute;inset:0;background:#fff}
.cutin .band{position:absolute;left:-20%;right:-20%;top:30%;height:40%;transform:rotate(-12deg);
  background:var(--lines, none) 0 0/400px 160px repeat,radial-gradient(ellipse at center,color-mix(in srgb,var(--c) 70%,#fff) 0,var(--c) 45%,var(--c2) 100%);
  box-shadow:0 0 0 8px var(--sun),0 0 0 14px var(--ink)}
.cutin img{position:relative;filter:drop-shadow(0 10px 0 rgba(0,0,0,.4))}
.cutin .ct{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);color:#fff;line-height:1.1;
  font-size:clamp(24px,8vw,40px);text-shadow:0 0 0 #000,3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.cutin .ct b{display:block;color:var(--sun);font-weight:400;font-size:1.25em}
.cutin.mega .band{background:var(--lines,none) 0 0/400px 160px repeat,
  linear-gradient(90deg,#ff3b30,#ff9500,#ffd23f,#3ddc97,#23b8e8,#5b6bff,#c56bff,#ff3b30) 0 0/160% 100%}
.cutin.mega .ct b{font-size:clamp(21px,6.8vw,34px);background:var(--rb);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.65));animation:rbflow 1.4s linear infinite}
.cutin .ct.bot{bottom:9%}
.cutin .ct.top{top:9%;transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){
  .result img,.result .rays,.confetti i,.result .pop{animation:none}
  .confetti{display:none}
}
</style>
</head>

<!-- ホーム -->

    <button class="quit" id="quitBtn" aria-label="やめる">✕</button>
  </div>

<script>
(() => {
/* ---------- データ ---------- */
/* 開発用のバージョン表示。index.html に手を入れたら ここも更新する。
   iPhoneのホーム画面から起動すると 古いキャッシュのままのことがあるので、
   いま端末に入っているものを ホーム下部で確認できるようにしている */
const VERSION = '0.8.1';
const BUILD = '2026-09-17';

const TYPES = [
  ['ノーマル','#9a9a7a','normal'],['ほのお','#f0582a','fire'],['みず','#3a8cf0','water'],['でんき','#e8b800','elec'],
  ['くさ','#4cae3c','grass'],['こおり','#5cc8d8','ice'],['かくとう','#c0352b','fight'],['どく','#9a43a8','ghost'],
  ['じめん','#c89a45','fight'],['ひこう','#8aa2f0','wind'],['エスパー','#f04e88','psy'],['むし','#8fae1f','grass'],
  ['いわ','#b0a050','fight'],['ゴースト','#6a55a0','ghost'],['ドラゴン','#6a3cf0','wind'],['あく','#6a5040','ghost'],
  ['はがね','#8a9ab0','fight'],['フェアリー','#e890c8','psy']
];
const typeInfo = n => TYPES.find(t => t[0] === n) || TYPES[0];
const HANDS = [['gu','✊'],['choki','✌️'],['pa','✋']];
/* メガシンカ技。ずかん登録で えらんだ ピックだけが メガシンカできる。
   [キー, わざ名, 説明, 色] */
const MEGA = [
  ['crit',  'かいしんの いちげき', 'かつと ハートを 2つ けずる',           '#ff5d52'],
  ['guard', 'まもりの かべ',       'まけても ハートが へらない',           '#3ddc97'],
  ['drain', 'いのちを すいとる',   'かつと けずって じぶんも 1つ かいふく', '#c56bff'],
  ['storm', 'あらしの ちから',     'あいこでも あいてを 1つ けずる',       '#23b8e8'],
];
const megaInfo = k => MEGA.find(m => m[0] === k) || null;
/* メガシンカ技の名前。登録していなければ そのパターンの既定名を使う */
const megaMoveOf = pk => pk?.megaMove || megaInfo(pk?.mega)?.[1] || '';
const RAINBOW = ['#ff3b30','#ff9500','#ffd23f','#3ddc97','#23b8e8','#5b6bff','#c56bff'];
const MEGA_ROUNDS = 1;          // メガシンカが つづく ラウンドすう（こうげき1回ぶん）
const BOND_MAX = 100;           // きずなゲージ
const BOND_GAIN = {lose:50, win:25, draw:15};
const BOND_STREAK = 25;   // 連敗が続くほど 1回あたりの上乗せが増える
/* 溜まり方に運をまぜる。同じ展開でも 発動タイミングが毎回ずれる */
const bondRoll = base => Math.round(base * (0.8 + Math.random() * 0.4));
const BEATS = {gu:'choki', choki:'pa', pa:'gu'};
const MAXHP = 3;

/* ピックの形（実物写真から計測：縦横比 約1.62、ボール側の角だけ大きく丸い） */
const RATIO = 1.62;
function pickPath(ctx, x, y, w, h, orient){
  const s = Math.min(w, h), r = s * 0.09, R = s * 0.21;
  const tl = r, tr = r, br = orient === 'v' ? R : r, bl = orient === 'v' ? r : R;
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y); ctx.arcTo(x + w, y, x + w, y + tr, tr);
  ctx.lineTo(x + w, y + h - br); ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
  ctx.lineTo(x + bl, y + h); ctx.arcTo(x, y + h, x, y + h - bl, bl);
  ctx.lineTo(x, y + tl); ctx.arcTo(x, y, x + tl, y, tl);
  ctx.closePath();
}

/* IndexedDB（使えない環境ではメモリ保持） */
const mem = new Map();
let dbp = null;
function db(){
  if (dbp) return dbp;
  dbp = new Promise(res => {
    try {
      const rq = indexedDB.open('pick-janken', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('picks', {keyPath:'id'});
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    } catch(e){ res(null); }
  });
  return dbp;
}
async function tx(mode, fn){
  const d = await db();
  if (!d) return fn(null);
  return new Promise(res => {
    try {
      const t = d.transaction('picks', mode), st = t.objectStore('picks');
      const r = fn(st);
      t.oncomplete = () => res(r && r.result !== undefined ? r.result : r);
      t.onerror = () => res(null);
    } catch(e){ res(fn(null)); }
  });
}
const store = {
  all: async () => { const r = await tx('readonly', st => st ? st.getAll() : [...mem.values()]); return (r || []).sort((a,b)=>a.created-b.created); },
  put: p => { mem.set(p.id, p); return tx('readwrite', st => st && st.put(p)); },
  del: id => { mem.delete(id); return tx('readwrite', st => st && st.delete(id)); }
};

/* サンプルピック（公式画像は使わず、図形で作る） */
function samplePick(name, type, move, orient, symbol, mega, megaMove){
  const W = orient === 'h' ? 486 : 300, H = orient === 'h' ? 300 : 486;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), col = typeInfo(type)[1];
  x.beginPath(); pickPath(x, 0, 0, W, H, orient); x.clip();
  x.fillStyle = '#e8ecf5'; x.fillRect(0,0,W,H);
  const g = x.createLinearGradient(0,0,W,H); g.addColorStop(0, col); g.addColorStop(1, '#1d2340');
  x.fillStyle = g; x.fillRect(22, 22, W-44, H-44);
  x.font = `${Math.min(W,H)*0.42}px serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(symbol, W/2, H/2);
  x.fillStyle = '#fff'; x.font = `800 ${Math.min(W,H)*0.09}px sans-serif`;
  x.fillText('SAMPLE', W/2, H - 40);
  return {id:'s-'+name, name, type, move, orient, mega, megaMove, img:c.toDataURL('image/png'), created:Date.now() + (orient==='v'?1:0), sample:true};
}
let picks = [];
async function loadPicks(){
  picks = await store.all();
  if (!picks.length){
    const a = samplePick('サンプル ほのお','ほのお','ファイアタックル','h','🔥','crit','レインボーバースト');
    const b = samplePick('サンプル でんき','でんき','かみなりキック','v','⚡','guard','にじいろバリア');
    await store.put(a); await store.put(b);
    picks = [a, b];
  }
}
/* チーム編成：1対1／2対2／3対3 の勝ち抜き戦。team[p][i] はピックのid */
const SIZES = [1, 2, 3];
const SIZE_LABEL = {1:'1たい1', 2:'2たい2', 3:'3たい3'};
const ORD = ['1ばんめ', '2ばんめ', '3ばんめ'];
const sideName = p => p === 1 ? 'あか' : 'あお';
let teamSize = 1;
const team = {1:[], 2:[]};

/* 人数ぶんの枠に整え、空きを未使用のピックで自動的に埋める。
   同じチーム内での重複は不可。相手チームとの重複は可（登録が少なくても遊べるように） */
function fitTeams(){
  for (const p of [1, 2]){
    const t = team[p].slice(0, teamSize);
    for (let i = 0; i < t.length; i++){
      if (!picks.some(x => x.id === t[i])) t[i] = null;        // 消されたピック
      else if (t.indexOf(t[i]) < i) t[i] = null;                // チーム内の重複
    }
    while (t.length < teamSize) t.push(null);
    for (let i = 0; i < teamSize; i++){
      if (t[i]) continue;
      const other = team[3 - p];
      const free = picks.find(x => !t.includes(x.id) && !other.includes(x.id))
                || picks.find(x => !t.includes(x.id));
      t[i] = free ? free.id : null;
    }
    team[p] = t;
  }
}
const teamReady = () => [1,2].every(p => team[p].length === teamSize && team[p].every(Boolean));

/* ---------- 画面遷移 ---------- */
const $ = s => document.querySelector(s);
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== id);
  if (id === 'home') renderHome();
  if (id === 'dex') renderDex();
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
function toast(t){ const d = document.createElement('div'); d.className='toast'; d.textContent=t; document.body.append(d); setTimeout(()=>d.remove(), 1800); }
function confirmBox(text, ok, label='けす'){
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="box"><div></div><div class="row"><button class="btn sub small">もどる</button><button class="btn small"></button></div></div>`;
  m.querySelector('.btn:not(.sub)').textContent = label;
  m.querySelector('.box > div').textContent = text;
  const [no, yes] = m.querySelectorAll('button');
  no.onclick = () => m.remove(); yes.onclick = () => { m.remove(); ok(); };
  document.body.append(m);
}
function chipHTML(type){ const t = typeInfo(type); return `<span class="chip" style="background:${t[1]}">${t[0]}</span>`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ホーム */
function renderHome(){
  // チーム内は重複なしなので、選べる人数は登録数が上限になる
  const maxN = Math.max(1, Math.min(3, picks.length));
  if (teamSize > maxN) teamSize = maxN;
  fitTeams();

  const row = $('#sizeRow'); row.innerHTML = '';
  for (const n of SIZES){
    const b = document.createElement('button');
    b.className = 'sizebtn' + (n === teamSize ? ' on' : '');
    b.textContent = SIZE_LABEL[n];
    b.disabled = n > maxN;
    b.onclick = () => { teamSize = n; sfx.unlock(); sfx.tone(760, .07); renderHome(); };
    row.append(b);
  }
  const hint = $('#sizeHint');
  hint.hidden = maxN >= 3;
  hint.textContent = `ピックを ${3 - maxN}まい とうろくすると 3たい3も できるよ`;

  $('#vsArea').className = 'vs' + (teamSize > 1 ? ' team n' + teamSize : '');
  for (const p of [1, 2]){
    const side = $('#side'+p);
    side.innerHTML = `<div class="sidelb">${sideName(p)}</div>`;
    for (let i = 0; i < teamSize; i++){
      const pk = picks.find(x => x.id === team[p][i]);
      const b = document.createElement('button');
      b.className = 'slot p' + p;
      b.innerHTML = `<div class="ord">${i+1}</div>` + (pk
        ? `<img src="${pk.img}" alt=""><div class="meta"><div class="nm">${esc(pk.name)}</div>${chipHTML(pk.type)}</div>`
          + (pk.mega ? `<div class="megaic">⚡</div>` : '')
        : `<div class="empty">？</div><div class="meta"><div class="nm">タップして えらぶ</div></div>`);
      b.onclick = () => { selFor = {p, i}; renderSelect(); show('select'); };
      side.append(b);
    }
  }
  $('#goBattle').disabled = !teamReady();
  $('#goBattle').textContent = teamSize > 1 ? `${SIZE_LABEL[teamSize]} で スタート！` : 'バトル スタート！';
}
let selFor = {p:1, i:0};
function renderSelect(){
  const {p, i} = selFor;
  $('#selTitle').textContent = teamSize > 1
    ? `${sideName(p)}の ${ORD[i]}を えらぼう`
    : `${sideName(p)}の ピックを えらぼう`;
  const g = $('#selGrid'); g.innerHTML = '';
  for (const pk of picks){
    const at = team[p].indexOf(pk.id);          // 同じチームで使用中の枠
    const used = at >= 0 && at !== i;
    const c = document.createElement('button');
    c.className = 'card' + (team[p][i] === pk.id ? ' sel' : '') + (used ? ' used' : '');
    c.innerHTML = `<img src="${pk.img}" alt=""><div class="nm">${esc(pk.name)}</div>${chipHTML(pk.type)}`
      + (pk.mega ? `<div class="megaic">⚡</div>` : '')
      + (used ? `<div class="usedlb">${ORD[at]}で つかってるよ</div>` : '');
    c.onclick = () => {
      if (used){ team[p][at] = team[p][i]; toast(`${ORD[at]}と いれかえたよ`); }  // 重複させずに入れ替える
      team[p][i] = pk.id;
      sfx.tone(880, .08); show('home');
    };
    g.append(c);
  }
}
$('#goDex').onclick = () => show('dex');
$('#goBattle').onclick = () => { sfx.unlock(); startBattle(); };
$('#soundBtn').onclick = () => { sfx.on = !sfx.on; $('#soundBtn').textContent = 'おと：' + (sfx.on?'オン':'オフ'); sfx.unlock(); };

/* ずかん */
function renderDex(){
  const g = $('#dexGrid'); g.innerHTML = '';
  const add = document.createElement('button'); add.className = 'card addcard';
  add.innerHTML = '<b>＋</b>あたらしい ピック'; add.onclick = () => openEditor();
  g.append(add);
  for (const pk of picks){
    const c = document.createElement('div'); c.className = 'card edit';
    const mi = megaInfo(pk.mega);
    c.innerHTML = `<img src="${pk.img}" alt=""><div class="nm">${esc(pk.name)}</div>${chipHTML(pk.type)}<div style="font-size:12px">${esc(pk.move)}</div>`
      + (mi ? `<div class="megabadge">⚡${esc(megaMoveOf(pk))}</div><div class="megadesc">${esc(mi[2])}</div>` : '')
      + `<div class="editic" aria-hidden="true">✏️</div><button class="del" aria-label="けす">✕</button>`;
    c.onclick = () => openEditor(pk);          // カードをタップして なおす
    c.querySelector('.del').onclick = e => {
      e.stopPropagation();
      confirmBox(`「${pk.name}」を けしますか？`, async () => {
        await store.del(pk.id); picks = picks.filter(x => x.id !== pk.id); renderDex();
      });
    };
    g.append(c);
  }
}

/* ---------- とうろくエディタ ---------- */
const cv = $('#edCanvas'), cx = cv.getContext('2d');
const ed = {img:null, orient:'h', tx:0, ty:0, s:1, rot:0, fine:0, type:'ノーマル', mega:null};
let editingId = null;   // なおしているピックのid（新規なら null）
/* 切り抜き済みの画像は 枠とおなじ比なので ぴったり収まる倍率にする */
function fitExisting(){ ed.s = frame().fw / ed.img.width; ed.tx = 0; ed.ty = 0; ed.rot = 0; ed.fine = 0; }
const typeBox = $('#typeBox');
TYPES.forEach(([n,col]) => {
  const b = document.createElement('button'); b.textContent = n; b.style.background = col;
  b.onclick = () => { ed.type = n; syncTypes(); };
  typeBox.append(b);
});
function syncTypes(){ [...typeBox.children].forEach(b => b.classList.toggle('on', b.textContent === ed.type)); }
const megaBox = $('#megaBox');
[[null, 'メガシンカ しない', 'ふつうの ピック'], ...MEGA].forEach(([k, name, desc, col]) => {
  const b = document.createElement('button');
  b.dataset.mega = k || '';
  b.innerHTML = `${esc(name)}<small>${esc(desc)}</small>`;
  if (col) b.style.background = col;
  b.onclick = () => { ed.mega = k; syncMegas(); };
  megaBox.append(b);
});
function syncMegas(){
  [...megaBox.children].forEach(b => b.classList.toggle('on', (b.dataset.mega || null) === ed.mega));
  // メガシンカ技を えらんだときだけ 名前の欄を出す。空のままなら 既定名を使う
  const mi = megaInfo(ed.mega);
  $('#megaMoveField').hidden = !mi;
  if (mi) $('#megaMoveIn').placeholder = `れい：${mi[1]}`;
}
/* pk を渡すと そのピックを なおすモードになる */
function openEditor(pk){
  editingId = pk ? pk.id : null;
  Object.assign(ed, {img:null, fromExisting:false, orient: pk?.orient || 'h', tx:0, ty:0, s:1, rot:0, fine:0,
    type: pk?.type || 'ノーマル', mega: pk?.mega || null});
  $('#megaMoveIn').value = pk?.megaMove || '';
  $('#nameIn').value = pk?.name || '';
  $('#moveIn').value = pk?.move || '';
  $('#rotRange').value = 0;
  syncRot(); syncTypes(); syncMegas(); syncOrient();
  $('#edTitle').textContent = pk ? 'ピックを なおす' : 'ピックを とうろく';
  $('#saveBtn').textContent = pk ? 'なおす' : 'とうろくする';
  $('#edTip').textContent = pk ? 'しゃしんは そのまま。かえたいときは とりなおしてね'
                               : '1本ゆびで いどう・2本ゆびで かくだい／かいてん';
  show('editor'); sizeCanvas();
  if (pk){
    // 切り抜き済みの画像を そのまま枠にはめ直す。写真を選び直さなければ 見たまま保存される
    const im = new Image();
    im.onload = () => {
      if (editingId !== pk.id) return;     // 読み込み中に画面を離れた
      ed.img = im; ed.fromExisting = true;
      fitExisting();
      draw();
    };
    im.src = pk.img;
  }
}
function sizeCanvas(){
  const w = cv.parentElement.clientWidth, h = Math.round(Math.min(w * 1.05, window.innerHeight * 0.5));
  const d = window.devicePixelRatio || 1;
  cv.width = w * d; cv.height = h * d; cv.style.height = h + 'px';
  cx.setTransform(d,0,0,d,0,0); draw();
}
function frame(){
  const W = cv.width / (window.devicePixelRatio||1), H = cv.height / (window.devicePixelRatio||1);
  let fw, fh;
  if (ed.orient === 'h'){ fw = W * 0.86; fh = fw / RATIO; if (fh > H*0.86){ fh = H*0.86; fw = fh*RATIO; } }
  else { fh = H * 0.86; fw = fh / RATIO; if (fw > W*0.86){ fw = W*0.86; fh = fw*RATIO; } }
  return {W, H, fx:(W-fw)/2, fy:(H-fh)/2, fw, fh};
}
function drawImg(ctx, W, H){
  if (!ed.img) return;
  ctx.save();
  ctx.translate(W/2 + ed.tx, H/2 + ed.ty);
  ctx.rotate((ed.rot + ed.fine) * Math.PI/180);
  ctx.scale(ed.s, ed.s);
  ctx.drawImage(ed.img, -ed.img.width/2, -ed.img.height/2);
  ctx.restore();
}
function draw(){
  const {W,H,fx,fy,fw,fh} = frame();
  cx.clearRect(0,0,W,H);
  drawImg(cx, W, H);
  if (!ed.img){
    cx.fillStyle = '#6b77a8'; cx.font = '800 15px sans-serif'; cx.textAlign = 'center';
    cx.fillText('うえの ボタンで しゃしんを えらんでね', W/2, 30);
  }
  cx.save();
  cx.beginPath(); cx.rect(0,0,W,H); pickPath(cx, fx, fy, fw, fh, ed.orient);
  cx.fillStyle = 'rgba(8,12,34,.62)'; cx.fill('evenodd');
  cx.beginPath(); pickPath(cx, fx, fy, fw, fh, ed.orient);
  cx.lineWidth = 3; cx.strokeStyle = '#ffd23f'; cx.setLineDash([10,6]); cx.stroke();
  cx.clip(); cx.setLineDash([]); cx.lineWidth = 1; cx.strokeStyle = 'rgba(255,255,255,.35)';
  cx.beginPath();
  for (let i=1;i<3;i++){ cx.moveTo(fx+fw*i/3, fy); cx.lineTo(fx+fw*i/3, fy+fh); cx.moveTo(fx, fy+fh*i/3); cx.lineTo(fx+fw, fy+fh*i/3); }
  cx.stroke();
  cx.restore();
}
function loadFile(f){
  if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const MAX = 2200, k = Math.min(1, MAX / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    ed.img = c; ed.fromExisting = false;
    $('#edTip').textContent = '1本ゆびで いどう・2本ゆびで かくだい／かいてん';
    const {W,H} = frame();
    ed.s = Math.max(W / c.width, H / c.height) * 1.6; ed.tx = 0; ed.ty = 0; ed.rot = 0; ed.fine = 0;
    $('#rotRange').value = 0; syncRot(); draw();
  };
  im.onerror = () => toast('しゃしんを よみこめませんでした');
  im.src = url;
}
$('#camBtn').onclick = () => $('#camIn').click();
$('#libBtn').onclick = () => $('#libIn').click();
$('#camIn').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
$('#libIn').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
document.querySelectorAll('[data-orient]').forEach(b => b.onclick = () => { ed.orient = b.dataset.orient; syncOrient(); draw(); });
function syncOrient(){ document.querySelectorAll('[data-orient]').forEach(b => b.classList.toggle('on', b.dataset.orient === ed.orient)); }
function syncRot(){ ed.fine = +$('#rotRange').value; $('#rotOut').textContent = ed.fine.toFixed(1) + '°'; }
$('#rotRange').oninput = () => { syncRot(); draw(); };
$('#rotL').onclick = () => { ed.rot -= 90; draw(); };
$('#rotR').onclick = () => { ed.rot += 90; draw(); };
$('#zIn').onclick = () => { ed.s *= 1.1; draw(); };
$('#zOut').onclick = () => { ed.s /= 1.1; draw(); };
$('#edReset').onclick = () => {
  if (!ed.img) return;
  if (ed.fromExisting) fitExisting();          // なおすときは 枠ぴったりに戻す
  else { const {W,H} = frame(); ed.s = Math.max(W/ed.img.width, H/ed.img.height)*1.6; ed.tx=ed.ty=ed.rot=0; }
  $('#rotRange').value=0; syncRot(); draw();
};

/* ジェスチャー：1本指で移動、2本指で拡大・回転 */
const ptrs = new Map();
let g0 = null;
function gState(){
  const [a, b] = [...ptrs.values()];
  return {mx:(a.x+b.x)/2, my:(a.y+b.y)/2, d:Math.hypot(b.x-a.x, b.y-a.y), ang:Math.atan2(b.y-a.y, b.x-a.x)};
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); if (ptrs.size === 2) g0 = gState(); });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !ed.img) return;
  const p = ptrs.get(e.pointerId), nx = e.clientX, ny = e.clientY;
  if (ptrs.size === 1){ ed.tx += nx - p.x; ed.ty += ny - p.y; p.x = nx; p.y = ny; }
  else if (ptrs.size === 2){
    p.x = nx; p.y = ny;
    const g = gState();
    // 画面上の中心(ピンチ中心)を基準に拡大・回転
    const {W,H} = frame(), ox = W/2 + ed.tx, oy = H/2 + ed.ty;
    const rect = cv.getBoundingClientRect();
    const px = g0.mx - rect.left, py = g0.my - rect.top;
    const k = g.d / g0.d, da = g.ang - g0.ang;
    let vx = ox - px, vy = oy - py;
    const c = Math.cos(da), s = Math.sin(da);
    const rx = (vx*c - vy*s) * k, ry = (vx*s + vy*c) * k;
    ed.tx = px + rx + (g.mx - g0.mx) - W/2;
    ed.ty = py + ry + (g.my - g0.my) - H/2;
    ed.s *= k; ed.rot += da * 180/Math.PI;
    g0 = g;
  }
  draw();
});
const up = e => { ptrs.delete(e.pointerId); g0 = ptrs.size === 2 ? gState() : null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); ed.s *= e.deltaY < 0 ? 1.05 : 1/1.05; draw(); }, {passive:false});
window.addEventListener('resize', () => { if (!$('#editor').hidden) sizeCanvas(); });

$('#saveBtn').onclick = async () => {
  const old = editingId ? picks.find(x => x.id === editingId) : null;
  if (!ed.img) return toast('さきに しゃしんを えらんでね');
  const name = $('#nameIn').value.trim(); if (!name) return toast('なまえを いれてね');
  const move = $('#moveIn').value.trim() || 'たいあたり';
  const {W,H,fx,fy,fw,fh} = frame();
  const LONG = 720, q = LONG / Math.max(fw, fh);
  const out = document.createElement('canvas'); out.width = Math.round(fw*q); out.height = Math.round(fh*q);
  const o = out.getContext('2d');
  o.scale(q, q); o.translate(-fx, -fy);
  o.beginPath(); pickPath(o, fx, fy, fw, fh, ed.orient); o.clip();
  o.imageSmoothingQuality = 'high';
  drawImg(o, W, H);
  // メガシンカ技の名前。未入力なら null にして 既定名で表示する
  const megaMove = ed.mega ? ($('#megaMoveIn').value.trim() || null) : null;
  const pk = {id: old ? old.id : 'p-'+Date.now(), name, type:ed.type, move, orient:ed.orient,
    mega:ed.mega, megaMove, img:out.toDataURL('image/png'), created: old ? old.created : Date.now()};
  if (old?.sample) pk.sample = true;
  await store.put(pk);
  if (old) picks[picks.indexOf(old)] = pk; else picks.push(pk);
  editingId = null;
  toast(old ? 'なおしました' : 'とうろく しました'); sfx.tone(660,.08); setTimeout(()=>sfx.tone(990,.12),90);
  show('dex');
};

/* ---------- サウンド ---------- */
const sfx = {
  on:true, ac:null, bus:null,
  /* 読み上げ音声（SpeechSynthesis）は端末の音量そのままで鳴るのに対し、
     Web Audio のゲインは小さいままだと効果音が埋もれてしまう。
     まとめて持ち上げたうえで、コンプレッサーでピークを抑えて歪ませない */
  unlock(){
    try {
      if (!this.ac){
        this.ac = new (window.AudioContext||window.webkitAudioContext)();
        const g = this.ac.createGain(); g.gain.value = 2.6;
        const c = this.ac.createDynamicsCompressor();
        g.connect(c).connect(this.ac.destination);
        this.bus = g;
      }
      this.ac.resume();
    } catch(e){}
  },
  tone(f, d, type='square', vol=.22, slide=0){
    if (!this.on || !this.bus) return;
    const a = this.ac, o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g).connect(this.bus); o.start(t); o.stop(t+d+.02);
  },
  noise(d, freq=1200, vol=.38){
    if (!this.on || !this.bus) return;
    const a = this.ac, n = a.createBuffer(1, a.sampleRate*d, a.sampleRate), ch = n.getChannelData(0);
    for (let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1) * (1 - i/ch.length);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = n; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f).connect(g).connect(this.bus); s.start();
  },
  say(t){
    if (!this.on) return;
    // 効果音とぶつかりすぎないよう 読み上げは少しだけ下げる
    try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 1.05; u.pitch = 1.3;
      u.volume = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
  }
};

/* ---------- エフェクト（パーティクル） ---------- */
const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], fxRun = false;
function sizeFx(){ const r = fx.getBoundingClientRect(), d = devicePixelRatio||1; fx.width = r.width*d; fx.height = r.height*d; fctx.setTransform(d,0,0,d,0,0); }
const FX = {
  fire:  {cols:['#ff4d1c','#ff9a1c','#ffe14d'], shape:'circle', n:46, sp:5, g:-.12, life:40, size:[6,16]},
  water: {cols:['#3a8cf0','#7cc4ff','#ffffff'], shape:'drop',   n:44, sp:7, g:.3,  life:42, size:[4,10]},
  elec:  {cols:['#ffe14d','#fff7b0','#ffffff'], shape:'bolt',   n:14, sp:6, g:0,   life:22, size:[20,40]},
  grass: {cols:['#4cae3c','#9be15d','#2f7d2a'], shape:'leaf',   n:30, sp:5, g:.05, life:55, size:[8,14]},
  ice:   {cols:['#bff4ff','#5cc8d8','#ffffff'], shape:'shard',  n:32, sp:6, g:.1,  life:45, size:[6,14]},
  fight: {cols:['#ffffff','#ffd23f','#ff5d52'], shape:'star',   n:22, sp:9, g:.2,  life:30, size:[8,18]},
  psy:   {cols:['#ff6fb1','#ffc2e0','#c56bff'], shape:'ring',   n:7,  sp:0, g:0,   life:40, size:[10,14]},
  ghost: {cols:['#8a6ad0','#4b2d86','#c9b3ff'], shape:'circle', n:36, sp:3, g:-.04,life:60, size:[8,20]},
  wind:  {cols:['#e6ecff','#8aa2f0','#ffffff'], shape:'arc',    n:18, sp:8, g:0,   life:30, size:[16,30]},
  normal:{cols:['#ffffff','#ffd23f'],           shape:'star',   n:18, sp:7, g:.15, life:30, size:[6,12]},
  rainbow:{cols:RAINBOW,                        shape:'star',   n:46, sp:8, g:.08, life:46, size:[8,20]}
};
function burst(kind, x, y, scale=1){
  const f = FX[kind] || FX.normal;
  const n = Math.round(f.n * scale);
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (0.3 + Math.random()) * f.sp * scale;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:f.g, life:f.life*(.7+Math.random()*.6), age:0,
      col:f.cols[i % f.cols.length], shape:f.shape, size:f.size[0] + Math.random()*(f.size[1]-f.size[0]), rot:Math.random()*6, vr:(Math.random()-.5)*.3, delay: f.shape==='ring' ? i*5 : 0});
  }
  if (!fxRun){ fxRun = true; requestAnimationFrame(tick); }
}
function tick(){
  const r = fx.getBoundingClientRect();
  fctx.clearRect(0,0,r.width,r.height);
  parts = parts.filter(p => p.age < p.life + p.delay);
  for (const p of parts){
    p.age++; if (p.age < p.delay) continue;
    const t = (p.age - p.delay) / p.life;
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .97; p.rot += p.vr;
    fctx.save(); fctx.globalAlpha = Math.max(0, 1 - t); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    fctx.fillStyle = p.col; fctx.strokeStyle = p.col;
    const s = p.size;
    switch(p.shape){
      case 'circle': fctx.beginPath(); fctx.arc(0,0,s*(1-t*.5),0,7); fctx.fill(); break;
      case 'drop': fctx.beginPath(); fctx.ellipse(0,0,s*.6,s,0,0,7); fctx.fill(); break;
      case 'leaf': fctx.beginPath(); fctx.ellipse(0,0,s,s*.45,0,0,7); fctx.fill(); break;
      case 'shard': fctx.beginPath(); fctx.moveTo(0,-s); fctx.lineTo(s*.4,0); fctx.lineTo(0,s); fctx.lineTo(-s*.4,0); fctx.fill(); break;
      case 'star': fctx.beginPath(); for (let i=0;i<10;i++){ const rr = i%2 ? s*.45 : s; fctx.lineTo(Math.cos(i*Math.PI/5)*rr, Math.sin(i*Math.PI/5)*rr); } fctx.fill(); break;
      case 'bolt': fctx.lineWidth = 4; fctx.beginPath(); fctx.moveTo(0,0); for (let i=1;i<5;i++) fctx.lineTo((Math.random()-.5)*s*.8, i*s*.5); fctx.stroke(); break;
      case 'ring': fctx.rotate(-p.rot); fctx.lineWidth = 5; fctx.beginPath(); fctx.arc(0,0,s + t*110,0,7); fctx.stroke(); break;
      case 'arc': fctx.lineWidth = 4; fctx.beginPath(); fctx.arc(0,0,s,0,2.2); fctx.stroke(); break;
    }
    fctx.restore();
  }
  if (parts.length) requestAnimationFrame(tick); else { fxRun = false; fctx.clearRect(0,0,r.width,r.height); }
}

/* ---------- バトル ---------- */
/* size 人ずつの勝ち抜き戦。team/hp は出場順の配列、idx が今たたかっているピック */
const B = {size:1, team:{1:[],2:[]}, hp:{1:[],2:[]}, idx:{1:0,2:0},

const wait = ms => new Promise(r => setTimeout(r, ms));

/* メガシンカするか聞く。ゾーンと同じく その子から読める向きで出す */

/* きずなが満タンになった最初の1回だけ 操作を教える */
const HINT_TEXT = 'ピックを ながおしで メガシンカ！';
function megaHint(p){

function renderBond(p){

  const fill = bar.querySelector('i'), lb = bar.querySelector('b');

  $('#f'+p).classList.toggle('canmega', ready);

    bar.className = 'bond mega';

  lb.textContent = !cur(p)?.mega ? 'この ピックは メガシンカ できない'

/* 連敗ボーナスがついたとき ゲージを一瞬光らせる */
function boostBond(p){

  if (!reduce) bar.animate([{filter:'brightness(2.4)'},{filter:'brightness(1)'}], {duration:750});

function renderRoster(){

function newRound(){

    b.innerHTML = `${e}<svg viewBox="0 0 106 106"><circle cx="53" cy="53" r="48"/></svg>`;

function lock(p, k){
  if (B.choice[p] || B.busy) return;
  B.choice[p] = k; sfx.tone(784,.1,'square',.3); setTimeout(()=>sfx.tone(1175,.12,'square',.3), 90);
  renderZone(p); renderBond(p);

function setBanner(big, sub=''){
  $('#banner').innerHTML = `<span class="flip">${esc(big)}</span><span>${esc(big)}</span>${sub ? `<span class="mv">${esc(sub)}</span>` : ''}`;
}
async function resolve(){
  B.busy = true;
  for (const w of ['じゃん','けん','ぽん！']){
    setBanner(w); sfx.tone(w==='ぽん！'?988:660, .16, 'square', .3);
    if (w==='じゃん') sfx.say('じゃん けん ぽん');
    await wait(w==='ぽん！' ? 200 : 450);
  }
  for (const p of [1,2]){
    const t = $('#f'+p+' .throw');
    t.textContent = HANDS.find(h => h[0] === B.choice[p])[1];
    t.animate([{opacity:0, transform:'scale(.2)'},{opacity:1, transform:'scale(1.3)'},{opacity:1, transform:'scale(1)'}], {duration:350, fill:'forwards'});
  }
  await wait(700);
  const a = B.choice[1], b = B.choice[2];
  let win, lose, tie = false;
  if (a === b){
    setBanner('あいこ！'); sfx.say('あいこで しょ');
    for (const p of [1,2]) $('#f'+p).animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}], {duration:300, iterations:2});
    await wait(1200);
    // あらしの ちから：あいこでも けずる。両方が あらしなら ぶつかって 相殺する
    const s1 = megaKey(1) === 'storm', s2 = megaKey(2) === 'storm';
    if (s1 === s2){
      for (const p of [1,2]) addBond(p, BOND_GAIN.draw);
      return endRound();              // だれの技も はたらいていない
    }
    win = s1 ? 1 : 2; lose = 3 - win; tie = true;
  } else {
    win = BEATS[a] === b ? 1 : 2; lose = 3 - win;
  }

  const wk = megaKey(win), lk = megaKey(lose);
  let dmg = wk === 'crit' ? 2 : 1;          // かいしんの いちげき
  if (lk === 'guard') dmg = 0;              // まもりの かべ
  await attack(win, lose, dmg);
  if (dmg){
    B.hp[lose][B.idx[lose]] = Math.max(0, B.hp[lose][B.idx[lose]] - dmg);
    if (wk === 'drain' && curHp(win) < MAXHP){   // いのちを すいとる
      B.hp[win][B.idx[win]]++;
      setBanner('ハートを すいとった！');
      [880, 1175].forEach((f, i) => setTimeout(() => sfx.tone(f, .16), i*110));
    }
  } else {
    setBanner('まもりの かべ！', 'ハートが へらない');
    sfx.tone(240, .45, 'sine', .22);
  }
  renderHearts(); renderRoster();
  await wait(dmg ? 500 : 1100);
  // きずなは 負けたほうに 多くたまる（運の係数つき）。連敗するほど 上乗せが増える
  B.streak[lose]++; B.streak[win] = 0;
  const bonus = BOND_STREAK * (B.streak[lose] - 1);
  addBond(win, BOND_GAIN.win);
  addBond(lose, BOND_GAIN.lose + bonus);
  if (bonus) boostBond(lose);
  // メガシンカ技が じっさいに はたらいた側だけ 1回ぶん使う。
  // じゃんけんに負けただけでは 解けない
  const fired = [];
  if (wk === 'crit' || wk === 'drain') fired.push(win);   // 勝ったときに はたらく技
  if (wk === 'storm' && tie) fired.push(win);             // あいこから けずったとき
  if (lk === 'guard') fired.push(lose);                   // まもりの かべが ふせいだとき
  if (curHp(lose) <= 0){
    await knockOut(lose);
    B.idx[lose]++; renderRoster();
    if (B.idx[lose] >= B.size) return finish(win, lose);   // 全員たおれた＝チームの負け
    await swapIn(lose);
  }
  endRound(fired);
}
/* ラウンドの締め。fired に入っているプレイヤーだけ メガシンカを1つ消費する。
   何も起きなかった回や、ただ負けただけの回で消えると
   せっかく溜めたゲージが無駄になるため */
async function endRound(fired = []){
  for (const p of fired){
    if (B.mega[p] > 0 && --B.mega[p] === 0) await megaEnd(p);
  }
  newRound();          // renderBond は newRound のなかで呼ばれる
}
let speedLines = null;
function makeSpeedLines(){
  // 横方向に流れる集中線（長さ・太さ・濃さをランダムに）
  const c = document.createElement('canvas'); c.width = 800; c.height = 320;
  const x = c.getContext('2d');
  for (let i = 0; i < 70; i++){
    const y = Math.random() * 320, len = 120 + Math.random() * 380, sx = Math.random() * 800;
    const th = 1 + Math.random() * 3, a = .25 + Math.random() * .45;
    for (const off of [0, -800]){
      const g = x.createLinearGradient(sx + off, 0, sx + off + len, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(sx + off, y, len, th);
    }
  }
  return `url(${c.toDataURL()})`;
}

/* メガストーン発動。カットインのあと オーラをまとう */

/* メガシンカ前のカットイン。メガストーンが光り、絆が高まったことを見せる */

  const pk = cur(p);
  const c = document.createElement('div'); c.className = 'megaintro';
  c.innerHTML = `<div class="band"></div><div class="veil"></div><div class="shock"></div>`
    + `<div class="stone"><i></i></div>`
    + `<div class="ct ${p === 1 ? 'bot' : 'top'}">${esc(pk.name)}と<b>きずなが ひかった！</b></div>`;
  $('#battle').append(c);
  const stone = c.querySelector('.stone'), band = c.querySelector('.band'), label = c.querySelector('.ct');
  sfx.tone(110, .9, 'sawtooth', .3, 440);        // 低いうなり
  setTimeout(() => { sfx.noise(.3, 5200, .5); sfx.tone(1568, .35, 'triangle', .3); }, 330);  // キーン
  band.animate([{transform:'rotate(-12deg) scaleY(0)'},{transform:'rotate(-12deg) scaleY(1)'}],
    {duration:220, fill:'forwards', easing:'ease-out'});
  stone.animate([
    {transform:'scale(0) rotate(-90deg)', opacity:0},
    {transform:'scale(1.25) rotate(20deg)', opacity:1, offset:.4},
    {transform:'scale(1) rotate(0)', opacity:1}], {duration:reduce?200:760, fill:'forwards', easing:'ease-out'});
  {
    const base = p === 2 ? 'rotate(180deg) ' : '';
    label.animate([{opacity:0, transform:base+'translateY(18px)'},{opacity:1, transform:base+'translateY(0)'}],
      {duration:320, delay:300, fill:'backwards'});
  }
  await wait(reduce ? 300 : 1150);
  const out = c.animate([{opacity:1},{opacity:0}], {duration:200, fill:'forwards'});
  await out.finished; c.remove();
}
/* メガシンカ発動の専用演出。虹の放射光・広がる虹の輪・飛び散る虹の粒でつくる */
async function megaCutIn(p){
  const pk = cur(p);
  const c = document.createElement('div'); c.className = 'megacut';
  const rings = [0, 230, 460].map(d => `<i style="animation-delay:${d}ms"></i>`).join('');
  const sparks = Array.from({length:28}, (_, i) =>
    `<i style="--a:${Math.round(i * 360 / 28)}deg;--c:${RAINBOW[i % RAINBOW.length]};`
    + `--d:${38 + Math.round(Math.random() * 26)}vmin;animation-delay:${(i % 7) * 45}ms"></i>`).join('');
  const rot = p === 1 ? 0 : 180;
  c.innerHTML = `<div class="rbrays"></div><div class="dim"></div><div class="rings">${rings}</div>`
    + `<div class="flash"></div>`
    + `<img class="ori-${pk.orient || 'h'}" src="${pk.img}" alt="">`
    + `<div class="sparks">${sparks}</div><div class="stone">💎</div>`
    + `<div class="ct ${p === 1 ? 'bot' : 'top'}">${esc(pk.name)}<b>メガシンカ！</b></div>`;
  $('#battle').append(c);
  const flash = c.querySelector('.flash'), img = c.querySelector('img'),
        stone = c.querySelector('.stone'), label = c.querySelector('.ct');
  img.style.transform = `rotate(${rot}deg)`;
  sfx.tone(200, 1.1, 'sawtooth', .1, 1760);           // ぐんぐん上がる音
  sfx.noise(.8, 3200, .15);
  // 虹の7色に合わせて 7音を駆け上がる
  [523, 587, 659, 784, 880, 988, 1175].forEach((f, i) =>
    setTimeout(() => sfx.tone(f, .17, 'triangle', .13), 200 + i * 95));
  sfx.say(`${pk.name} メガシンカ！`);
  flash.animate([{opacity:0},{opacity:.85, offset:.22},{opacity:0}], {duration:520, fill:'forwards'});
  // ストーンが回りながら ピックに吸い込まれる
  stone.animate([
    {transform:'scale(0) rotate(0)', opacity:0},
    {transform:'scale(1.7) rotate(360deg)', opacity:1, offset:.45},
    {transform:'scale(.15) rotate(760deg)', opacity:0}], {duration:reduce?200:1100, fill:'forwards', easing:'ease-in'});
  img.animate([
    {transform:`rotate(${rot}deg) scale(.75)`, filter:'brightness(1)'},
    {transform:`rotate(${rot}deg) scale(.92)`, filter:'brightness(3.4)', offset:.45},
    {transform:`rotate(${rot}deg) scale(1.18)`, filter:'brightness(1)'}], {duration:reduce?200:1200, fill:'forwards', easing:'ease-out'});
  {
    const base = p === 2 ? 'rotate(180deg) ' : '';
    label.animate([{opacity:0, transform:base+'scale(2.3)'},{opacity:1, transform:base+'scale(1)'}],
      {duration:380, delay:460, fill:'backwards'});
  }
  await wait(reduce ? 300 : 1450);
  const out = c.animate([{opacity:1},{opacity:0}], {duration:240, fill:'forwards'});
  await out.finished; c.remove();
}
async function megaEnd(p){
  const f = $('#f'+p);
  if (!reduce) f.animate([{filter:'brightness(2.2) saturate(2)'},{filter:'none'}], {duration:600});
  f.classList.remove('mega');
  setBanner('メガシンカが とけた！');
  [1175, 988, 784, 587].forEach((hz, i) => setTimeout(() => sfx.tone(hz, .16, 'triangle', .1), i * 90));
  await wait(reduce ? 200 : 950);
}
/* たおれたピックが 回転しながら ふっとぶ */
async function knockOut(l){
  const D = $('#f'+l), cd = center(D);
  setBanner(B.size > 1 ? `${sideName(l)}の ${ORD[B.idx[l]]} ダウン！` : 'やったー！');
  sfx.tone(300, .8, 'sawtooth', .2, 60);
  burst(typeInfo(cur(3 - l).type)[2], cd.x, cd.y, 1.6);
  await D.animate([{transform:'translate(0,0) rotate(0) scale(1)', opacity:1},
    {transform:`translate(${l===1?160:-160}px, ${l===1?220:-220}px) rotate(${l===1?720:-720}deg) scale(.3)`, opacity:0}],
    {duration:reduce?10:1100, easing:'ease-in', fill:'forwards'}).finished;
}
/* つぎのピックが 自分がわから 登場する。ハートは 3つで 仕切りなおし */
async function swapIn(p){
  const f = $('#f'+p), pk = cur(p);
  // メガシンカしたピックが たおれたら 効果も消える
  if (B.mega[p] > 0){ B.mega[p] = 0; f.classList.remove('mega'); }
  resetFighter(p);
  setFighter(p);
  renderHearts(); renderRoster();
  renderBond(p);
  setBanner(`${sideName(p)}の こうたい！`, pk.name);
  sfx.say(`つぎは ${pk.name}`);
  [587, 784, 988].forEach((hz, i) => setTimeout(() => sfx.tone(hz, .14), i*110));
  await f.animate([
    {transform:`translateY(${p===1 ? 130 : -130}%) scale(.5)`, opacity:0},
    {transform:'translateY(0) scale(1.1)', opacity:1, offset:.72},
    {transform:'translateY(0) scale(1)', opacity:1}],
    {duration: reduce ? 10 : 620, easing:'cubic-bezier(.2,.9,.3,1.2)'}).finished;
  await wait(reduce ? 0 : 500);
}
async function finish(w, l){
  B.over = true;
  const pk = cur(w), who = sideName(w);
  // 先鋒のまま勝ち切った＝ひとりで相手チームを全滅させた
  const sweep = B.size > 1 && B.idx[w] === 0;
  const sweepHTML = sweep ? `${esc(pk.name)}が ひとりで ぜんいん たおした！` : '';
  setBanner('やったー！');
  // それぞれの子には 自分がわの結果 を、自分から読める向きで出す
  const line = q => `${sideName(q)}の ${q === w ? 'かち！' : 'まけ'}`;
  const wcls = q => 'w' + (q === w ? '' : ' lose');
  // 上から順にぽんぽん出していく
  let t = .05;
  const pop = (html, step = .12) => { const h = html.replace('<%D%>', `animation-delay:${t.toFixed(2)}s`); t += step; return h; };
  // チームの戦績。たおれたピックは白黒になる
  const strip = q => pop(`<div class="teamline t${q}${q === 2 ? ' flip' : ''} pop" style="<%D%>"><b>${sideName(q)}</b>`
    + B.team[q].map((x, i) => `<i class="${B.hp[q][i] > 0 ? '' : 'down'}" style="background-image:url(${x.img})"></i>`).join('')
    + `</div>`);
  const hearts = Array.from({length:MAXHP}, (_, i) => `<span class="${i < curHp(w) ? '' : 'gone'}">❤️</span>`).join('');
  const team = B.size > 1;

  const r = document.createElement('div'); r.className = 'result';
  r.style.setProperty('--wc', w === 1 ? '255,93,82' : '35,184,232');
  const conf = Array.from({length:26}, () => {
    const col = ['#ffd23f', '#fff', '#ffe98a', `rgb(${w === 1 ? '255,93,82' : '35,184,232'})`][Math.floor(Math.random()*4)];
    return `<i style="left:${(Math.random()*100).toFixed(1)}%;background:${col};`
      + `animation-duration:${(2.6 + Math.random()*2.8).toFixed(2)}s;animation-delay:${(-Math.random()*5).toFixed(2)}s"></i>`;
  }).join('');

  r.innerHTML = `<div class="rays"></div><div class="dim"></div><div class="confetti">${conf}</div><div class="stack">`
    + (team ? strip(2) : '')
    + pop(`<div class="${wcls(2)} flip pop" style="<%D%>">${line(2)}</div>`)
    + (sweep ? pop(`<div class="sweep flip pop" style="<%D%>">${sweepHTML}</div>`) : '')
    + pop(`<div class="crown pop" style="<%D%>">👑</div>`)
    + pop(`<div class="champ pop" style="<%D%>"><img class="ori-${pk.orient || 'h'}" src="${pk.img}" alt=""></div>`, .16)
    + pop(`<div class="hp pop" style="<%D%>">${hearts}</div>`)
    + (sweep ? pop(`<div class="sweep pop" style="<%D%>">${sweepHTML}</div>`) : '')
    + pop(`<div class="${wcls(1)} pop" style="<%D%>">${line(1)}</div>`)
    + (team ? strip(1) : '')
    + pop(`<div class="row pop" style="<%D%>"><button class="btn small" id="again">もういっかい</button><button class="btn sub small" id="toHome">ピックを かえる</button></div>`)
    + `</div>`;
  $('#battle').append(r);   // アリーナではなくバトル画面全体を覆い、下の手えらびを隠す
  sfx.say(sweep ? `${who}の かんぜんしょうり！` : `${who}の かち！`);
  [523,659,784,1047,1319].forEach((f,i) => setTimeout(() => sfx.tone(f,.2,'square',.26), i*120));
  setTimeout(() => sfx.noise(.5, 3200, .1), 620);   // キラキラ
  r.querySelector('#again').onclick = startBattle;
  r.querySelector('#toHome').onclick = () => show('home');
}
$('#quitBtn').onclick = () => confirmBox('バトルを やめますか？', () => show('home'), 'やめる');
window.addEventListener('resize', () => { if (!$('#battle').hidden) sizeFx(); });

/* 起動 */
$('#ver').textContent = `v${VERSION} (${BUILD})`;
loadPicks().then(() => {
  show('home');   // renderHome() が fitTeams() でチームを自動的に埋める
});
})();
</script>
</body>
</html>
